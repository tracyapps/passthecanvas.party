<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Pass the Canvas — Make something. Together.</title>
    <meta name="theme-color" content="#f5edda" />
    <script>
      // Apply the saved appearance before painting the page, so navigation never flashes light.
      try {
        if (localStorage.getItem('ptc-site-theme-v1') === 'dark') {
          document.documentElement.dataset.siteTheme = 'dark';
          document.querySelector('meta[name="theme-color"]').content = '#24231f';
        }
      } catch { /* The site still works when browser storage is unavailable. */ }
    </script>
    <link rel="icon" href="/site/favicon.svg" type="image/svg+xml" />
    <meta name="description" content="Make something. Together. A little paint, a few friends, and no masterpiece required. Try the free paint preview." />
    <link href="/site/fonts.css" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
