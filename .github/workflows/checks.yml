name: Checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type checks, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ptc_test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: ptc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ptc_test -d ptc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PTC_TEST_DATABASE_URL: postgres://ptc_test:test-only@127.0.0.1:5432/ptc_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
